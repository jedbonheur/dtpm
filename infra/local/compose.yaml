# Local development dependencies only (TDD §30.1).
# Not production hosting. Fake providers remain the default.
# Phase 0 baseline — TDD §35 cloud/runtime vendors remain pending approval.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dtpm-postgres
    environment:
      POSTGRES_USER: dtpm
      POSTGRES_PASSWORD: dtpm
      POSTGRES_DB: dtpm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtpm -d dtpm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dtpm_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dtpm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dtpm_pg_data:
